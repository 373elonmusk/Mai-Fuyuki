<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>{{file_name}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
    <style>
        :root{--black:#000;--dark:#0a0a0a;--dim:#111;--surface:#181818;--edge:#252525;--mid:#3a3a3a;--muted:#6a6a6a;--silver:#a0a0a0;--light:#d4d4d4;--white:#f5f5f5;--pure:#fff}
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        html{scroll-behavior:smooth}
        body{font-family:'DM Mono',monospace;background:var(--black);color:var(--light);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
        body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:9999;opacity:.35}

        header{display:flex;align-items:center;justify-content:space-between;padding:0 2rem;height:52px;background:rgba(0,0,0,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--edge);flex-shrink:0}
        .brand{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:300;letter-spacing:.2em;color:var(--white);text-transform:uppercase;text-decoration:none}
        .htag{font-size:.6rem;letter-spacing:.3em;color:var(--muted);text-transform:uppercase}

        main{flex:1;display:flex;align-items:center;justify-content:center;padding:3rem 1.5rem}

        .card{width:100%;max-width:520px;background:var(--dim);border:1px solid var(--edge);border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.02),0 24px 64px rgba(0,0,0,.8);overflow:hidden;animation:rise .4s ease-out}
        @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

        .card-top{padding:2rem 2rem 1.5rem;border-bottom:1px solid var(--edge)}

        .file-icon{width:48px;height:48px;background:var(--surface);border:1px solid var(--edge);border-radius:2px;display:flex;align-items:center;justify-content:center;margin-bottom:1.25rem}
        .file-icon svg{color:var(--silver)}

        .file-name{font-family:'Cormorant Garamond',serif;font-size:clamp(.95rem,2.5vw,1.35rem);font-weight:400;color:var(--white);line-height:1.35;word-break:break-word;margin-bottom:.75rem}

        .meta-row{display:flex;gap:1.25rem;flex-wrap:wrap}
        .meta-item{display:flex;align-items:center;gap:.35rem;font-size:.6rem;letter-spacing:.15em;color:var(--muted);text-transform:uppercase}
        .meta-item svg{width:11px;height:11px;flex-shrink:0}

        .card-body{padding:1.5rem 2rem}

        .dl-btn{display:flex;align-items:center;justify-content:center;gap:.6rem;width:100%;padding:.85rem 1.25rem;font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.15em;font-weight:500;text-transform:uppercase;background:var(--white);color:var(--black);border:1px solid var(--white);border-radius:2px;cursor:pointer;transition:all .18s ease;margin-bottom:.5rem}
        .dl-btn:hover{background:var(--pure);box-shadow:0 4px 24px rgba(255,255,255,.2);transform:translateY(-1px)}
        .dl-btn svg{width:14px;height:14px;flex-shrink:0}

        .copy-btn{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;padding:.7rem 1rem;font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;background:var(--surface);color:var(--silver);border:1px solid var(--edge);border-radius:2px;cursor:pointer;transition:all .18s ease}
        .copy-btn:hover{background:var(--dim);border-color:var(--mid);color:var(--white)}
        .copy-btn svg{width:13px;height:13px;flex-shrink:0}

        .copy-toast{display:none;align-items:center;justify-content:center;gap:.35rem;margin-top:.5rem;font-size:.6rem;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
        .copy-toast.show{display:flex}

        .url-box{margin-top:.875rem;padding:.625rem .875rem;background:var(--surface);border:1px solid var(--edge);border-radius:2px;font-size:.6rem;letter-spacing:.05em;color:var(--muted);word-break:break-all;line-height:1.6;user-select:all;cursor:text}

        footer{text-align:center;padding:1.5rem;border-top:1px solid var(--edge);font-size:.58rem;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;flex-shrink:0}
    </style>
</head>
<body>

<header>
    <span class="brand">Download</span>
    <span class="htag">Private</span>
</header>

<main>
    <div class="card">
        <div class="card-top">
            <div class="file-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
                    <polyline points="13 2 13 9 20 9"/>
                </svg>
            </div>
            <div class="file-name" id="fname">{{file_name}}</div>
            <div class="meta-row">
                <div class="meta-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="12"/>
                        <line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                    {{file_size}}
                </div>
                <div class="meta-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                    </svg>
                    Ready
                </div>
            </div>
        </div>

        <div class="card-body">
            <button class="dl-btn" onclick="doDownload()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                Download File
            </button>

            <button class="copy-btn" onclick="copyUrl()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                </svg>
                Copy Link
            </button>

            <div class="copy-toast" id="toast">
                <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
                Copied to clipboard
            </div>

            <div class="url-box" id="urlbox">{{file_url}}</div>
        </div>
    </div>
</main>

<footer>Download &mdash; &copy; 2026</footer>

<script>
    var FILE_URL="{{file_url}}",FILE_NAME="{{file_name}}";

    function doDownload(){
        var a=document.createElement("a");
        a.href=FILE_URL;a.download=FILE_NAME;
        document.body.appendChild(a);a.click();document.body.removeChild(a);
    }

    function copyUrl(){
        if(navigator.clipboard){
            navigator.clipboard.writeText(FILE_URL).then(showToast,fallback);
        } else { fallback(); }
    }

    function fallback(){
        var box=document.getElementById("urlbox");
        var range=document.createRange();
        range.selectNodeContents(box);
        var sel=window.getSelection();
        sel.removeAllRanges();sel.addRange(range);
        try{document.execCommand("copy");showToast();}catch(e){}
        sel.removeAllRanges();
    }

    function showToast(){
        var t=document.getElementById("toast");
        t.classList.add("show");
        setTimeout(function(){t.classList.remove("show");},2000);
    }

    function cleanName(){
        var el=document.getElementById("fname");
        if(!el)return;
        el.textContent=el.textContent.replace(/\./g," ").replace(/[_\[\]{}]/g," ").replace(/\s+/g," ").trim();
    }

    if(document.readyState==="loading"){
        document.addEventListener("DOMContentLoaded",cleanName);
    } else { cleanName(); }
</script>
</body>
</html>
