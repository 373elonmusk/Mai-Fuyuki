<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>{{file_name}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css"/>
    <style>
        :root{--black:#000;--dark:#0a0a0a;--dim:#111;--surface:#181818;--edge:#252525;--mid:#3a3a3a;--muted:#6a6a6a;--silver:#a0a0a0;--light:#d4d4d4;--white:#f5f5f5;--pure:#fff}
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        html{scroll-behavior:smooth}
        body{font-family:'DM Mono',monospace;background:var(--black);color:var(--light);min-height:100vh;overflow-x:hidden}
        body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:9999;opacity:.35}

        header{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;height:52px;background:rgba(0,0,0,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--edge)}
        .brand{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:300;letter-spacing:.2em;color:var(--white);text-transform:uppercase;text-decoration:none}
        .htag{font-size:.6rem;letter-spacing:.3em;color:var(--muted);text-transform:uppercase}

        main{padding-top:52px;max-width:940px;margin:0 auto;padding-left:1.5rem;padding-right:1.5rem;padding-bottom:4rem}

        .player-section{margin-top:2rem}
        .player-frame{border-radius:3px;overflow:hidden;background:var(--dim);border:1px solid var(--edge);box-shadow:0 0 0 1px rgba(255,255,255,.03),0 24px 64px rgba(0,0,0,.85)}
        .video-wrap{position:relative;width:100%;padding-bottom:56.25%;background:var(--black)}
        .video-wrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
        .video-wrap .plyr{position:absolute;inset:0;width:100%;height:100%}

        .rule{height:1px;background:var(--edge);margin:1.25rem 0}

        .info-bar{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;padding-bottom:1.25rem}
        .file-title{font-family:'Cormorant Garamond',serif;font-size:clamp(1rem,3vw,1.55rem);font-weight:400;color:var(--white);line-height:1.35;word-break:break-word}
        .file-size{font-size:.6rem;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;white-space:nowrap;margin-top:.2rem}

        .actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.4rem}
        .btn{display:flex;align-items:center;justify-content:center;gap:.45rem;padding:.65rem .875rem;font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;border-radius:2px;cursor:pointer;transition:all .18s ease;text-decoration:none;border:1px solid var(--edge);background:var(--surface);color:var(--silver)}
        .btn:hover{background:var(--dim);border-color:var(--mid);color:var(--white);transform:translateY(-1px)}
        .btn-primary{background:var(--white);color:var(--black);border-color:var(--white);font-weight:500}
        .btn-primary:hover{background:var(--pure);border-color:var(--pure);box-shadow:0 4px 20px rgba(255,255,255,.18)}
        .btn img{width:13px;height:13px;filter:grayscale(1) brightness(1.8)}
        .btn svg{width:13px;height:13px;flex-shrink:0}

        .dropdown{position:relative}
        .dropdown-menu{position:absolute;bottom:calc(100% + 6px);right:0;min-width:200px;background:var(--dim);border:1px solid var(--edge);border-radius:2px;padding:.4rem;opacity:0;visibility:hidden;transform:translateY(6px);transition:all .15s ease;z-index:50}
        .dropdown-menu.open{opacity:1;visibility:visible;transform:translateY(0)}
        .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:.3rem}
        .pitem{display:flex;align-items:center;gap:.45rem;padding:.45rem .55rem;background:var(--surface);border:1px solid var(--edge);border-radius:2px;color:var(--silver);text-decoration:none;font-size:.63rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:all .12s ease}
        .pitem:hover{background:var(--edge);color:var(--white);border-color:var(--mid)}
        .pitem img{width:13px;height:13px;filter:grayscale(1) brightness(1.8);flex-shrink:0}

        .audio-warn{display:flex;align-items:center;gap:.5rem;margin-top:.875rem;padding:.625rem .875rem;background:rgba(255,255,255,.025);border:1px solid var(--edge);border-radius:2px;font-size:.62rem;letter-spacing:.1em;color:var(--muted)}

        .plyr{--plyr-color-main:#fff;--plyr-range-fill-background:#fff;--plyr-video-control-background-hover:rgba(255,255,255,.1)}
        .plyr__control--overlaid{background:rgba(255,255,255,.1)!important;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18)!important}
        .plyr__control--overlaid:hover{background:rgba(255,255,255,.2)!important}
        .plyr--video .plyr__controls{background:linear-gradient(transparent,rgba(0,0,0,.65))}

        .ctrl-dropdown{position:absolute;bottom:calc(100% + 8px);right:0;min-width:140px;background:rgba(8,8,8,.98);border:1px solid var(--edge);border-radius:2px;padding:.3rem;opacity:0;visibility:hidden;transform:translateY(6px);transition:all .13s ease;z-index:200}
        .ctrl-dropdown.open{opacity:1;visibility:visible;transform:translateY(0)}
        .citem{display:flex;align-items:center;justify-content:space-between;padding:.38rem .55rem;border-radius:2px;font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.1em;color:var(--silver);cursor:pointer;transition:all .1s}
        .citem:hover,.citem.active{background:var(--surface);color:var(--white)}

        footer{text-align:center;padding:2rem 1.5rem;border-top:1px solid var(--edge);font-size:.58rem;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}

        @media(max-width:640px){
            header{padding:0 1rem}
            .actions{grid-template-columns:1fr 1fr}
            .btn{padding:.55rem .5rem;font-size:.63rem}
            .info-bar{flex-direction:column;gap:.4rem}
        }
    </style>
</head>
<body>

<header>
    <span class="brand">Stream</span>
    <span class="htag">Private</span>
</header>

<main>
    <section class="player-section">
        <div class="player-frame">
            <div class="video-wrap">
                <video id="player" playsinline controls>
                    <source src="{{file_url}}"/>
                </video>
            </div>
        </div>
    </section>

    <div class="rule"></div>

    <div class="info-bar">
        <h1 class="file-title" id="ftitle">{{file_name}}</h1>
        <div class="file-size">{{file_size}}</div>
    </div>

    <div class="actions">
        <button class="btn btn-primary" onclick="doDownload()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            Download
        </button>
        <button class="btn" onclick="vlc_player()">
            <img src="https://i.postimg.cc/15TQ4y7B/vlc.png" alt="VLC"/>VLC
        </button>
        <button class="btn" onclick="mx_player()">
            <img src="https://i.postimg.cc/sx4Msv4T/mx.png" alt="MX"/>MX Player
        </button>
        <div class="dropdown">
            <button class="btn" onclick="toggleMore()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>
                </svg>
                More
            </button>
            <div class="dropdown-menu" id="more-menu">
                <div class="pgrid">
                    <a class="pitem" onclick="playit_player();return false;"><img src="https://i.postimg.cc/RVGWYJFF/playit.png" alt=""/>PLAYit</a>
                    <a class="pitem" onclick="km_player();return false;"><img src="https://i.postimg.cc/wT9tFQ9Z/km.png" alt=""/>KMPlayer</a>
                    <a class="pitem" onclick="s_player();return false;"><img src="https://i.postimg.cc/XYJr6NGg/s.png" alt=""/>S Player</a>
                    <a class="pitem" onclick="hd_player();return false;"><img src="https://i.postimg.cc/rFT43LNh/hd.png" alt=""/>HD Player</a>
                    <a class="pitem" onclick="mx_playerpro();return false;"><img src="https://i.postimg.cc/sx4Msv4T/mx.png" alt=""/>MX Pro</a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer>Stream &mdash; &copy; 2026</footer>

<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/Bharathboy/utils@main/jsmkv-polyfill.js"></script>
<script>
    var FILE_URL="{{file_url}}",FILE_NAME="{{file_name}}";

    function initPlayer(){
        var v=document.getElementById("player");
        if(!v)return;
        var s=(v.querySelector("source")||{}).src||"";
        var ext=s.split("?")[0].split(".").pop().toLowerCase();
        if(["flv","ts"].includes(ext)&&typeof mpegts!=="undefined"){initMpegts(v,s);}
        else{setTimeout(function(){initPlyr(v);},80);}
    }
    function initPlyr(v){
        if(window._plyr||typeof Plyr==="undefined")return;
        window._plyr=new Plyr(v,{controls:["play-large","play","progress","current-time","volume","pip","fullscreen"]});
        setTimeout(addControls,250);
    }
    function initMpegts(v,url){
        try{var p=mpegts.createPlayer({type:"flv",url:url,isLive:false});p.attachMediaElement(v);p.load();initPlyr(v);}
        catch(e){initPlyr(v);}
    }
    function addControls(){
        var bar=document.querySelector(".plyr__controls");
        if(!bar)return;
        var fs=bar.querySelector('[data-plyr="fullscreen"]');
        if(!fs)return;
        var sBtn=mkBtn("&#9654; Speed"),sDD=mkDD([{l:"0.5x",v:"0.5"},{l:"0.75x",v:"0.75"},{l:"1x Normal",v:"1",a:true},{l:"1.25x",v:"1.25"},{l:"1.5x",v:"1.5"},{l:"1.75x",v:"1.75"},{l:"2x",v:"2"}],function(v){var vid=document.getElementById("player");if(vid)vid.playbackRate=parseFloat(v);});
        sBtn.appendChild(sDD);bar.insertBefore(sBtn,fs);
        sBtn.addEventListener("click",function(e){e.stopPropagation();tDD(sDD);});
        var aBtn=mkBtn("&#9649; Ratio"),aDD=mkDD([{l:"Original",v:"original"},{l:"Fill",v:"cover"},{l:"16:9",v:"1.778",a:true},{l:"4:3",v:"1.333"},{l:"21:9",v:"2.333"}],function(v){
            var vid=document.getElementById("player");if(!vid)return;
            vid.style.cssText="position:absolute;top:0;left:0;width:100%;height:100%;";
            if(v==="cover"){vid.style.objectFit="cover";}
            else if(v==="original"){vid.style.objectFit="contain";}
            else{var tr=parseFloat(v),cr=16/9;vid.style.objectFit="fill";
                if(tr<cr){var wp=(tr/cr)*100;vid.style.width=wp+"%";vid.style.left=((100-wp)/2)+"%";}
                else{var hp=(cr/tr)*100;vid.style.height=hp+"%";vid.style.top=((100-hp)/2)+"%";}}
        });
        aBtn.appendChild(aDD);bar.insertBefore(aBtn,fs);
        aBtn.addEventListener("click",function(e){e.stopPropagation();tDD(aDD);});
        document.addEventListener("click",function(e){
            if(!sBtn.contains(e.target))sDD.classList.remove("open");
            if(!aBtn.contains(e.target))aDD.classList.remove("open");
        });
    }
    function mkBtn(h){var b=document.createElement("button");b.className="plyr__controls__item plyr__control";b.type="button";b.style.cssText="font-size:9px;letter-spacing:.08em;padding:4px 7px;position:relative;";b.innerHTML=h;return b;}
    function mkDD(items,cb){
        var dd=document.createElement("div");dd.className="ctrl-dropdown";
        items.forEach(function(item){
            var el=document.createElement("div");el.className="citem"+(item.a?" active":"");el.textContent=item.l;
            el.addEventListener("click",function(e){e.stopPropagation();dd.querySelectorAll(".citem").forEach(function(i){i.classList.remove("active");});el.classList.add("active");cb(item.v);dd.classList.remove("open");});
            dd.appendChild(el);
        });
        return dd;
    }
    function tDD(dd){document.querySelectorAll(".ctrl-dropdown").forEach(function(d){if(d!==dd)d.classList.remove("open");});dd.classList.toggle("open");}
    function toggleMore(){document.getElementById("more-menu").classList.toggle("open");}
    document.addEventListener("click",function(e){if(!e.target.closest(".dropdown")){var m=document.getElementById("more-menu");if(m)m.classList.remove("open");}});
    function doDownload(){var a=document.createElement("a");a.href=FILE_URL;a.download=FILE_NAME;document.body.appendChild(a);a.click();document.body.removeChild(a);}
    function vlc_player(){var s=FILE_URL.replace(/^https?:\/\//,"");window.location.href="vlc://"+s;setTimeout(function(){window.location.href="intent:"+FILE_URL+"#Intent;action=android.intent.action.VIEW;type=video/*;package=org.videolan.vlc;end";},500);}
    function mx_player(){window.location.href="intent:"+FILE_URL+"#Intent;action=android.intent.action.VIEW;type=video/*;package=com.mxtech.videoplayer.ad;end";}
    function mx_playerpro(){window.location.href="intent:"+FILE_URL+"#Intent;action=android.intent.action.VIEW;type=video/*;package=com.mxtech.videoplayer.pro;end";}
    function playit_player(){window.location.href="playit://playerv2/video?url="+encodeURIComponent(FILE_URL);}
    function km_player(){window.location.href="intent:"+FILE_URL+"#Intent;action=android.intent.action.VIEW;type=video/*;package=com.kmplayer;end";}
    function s_player(){window.location.href="intent:"+FILE_URL+"#Intent;action=com.young.simple.player.playback_online;package=com.young.simple.player;end";}
    function hd_player(){window.location.href="intent:"+FILE_URL+"#Intent;action=android.intent.action.VIEW;type=video/*;package=uplayer.video.player;end";}
    function checkAudio(){var t=document.createElement("video");if(t.canPlayType('audio/mp4; codecs="ec-3"')===""){var sec=document.querySelector("main");if(sec){var w=document.createElement("div");w.className="audio-warn";w.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><span>EAC3 audio may not play in browser — use an external player.</span>';sec.appendChild(w);}}}
    function cleanTitle(){var el=document.getElementById("ftitle");if(!el)return;el.textContent=el.textContent.replace(/\./g," ").replace(/[_\[\]{}]/g," ").replace(/\.(mkv|mp4|avi|mov)/gi," ").replace(/\s+/g," ").trim();}
    function boot(){cleanTitle();initPlayer();checkAudio();}
    if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",boot);}else{boot();}
</script>
</body>
</html>
